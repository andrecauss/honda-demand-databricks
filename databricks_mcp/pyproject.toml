[project]
name = "honda-databricks-mcp"
version = "0.1.0"
description = "Administrative MCP server for the Honda Databricks DEV workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.60.0",
    "fastapi>=0.115.12",
    "fastmcp>=2.12.5",
    "pydantic>=2",
    "uvicorn>=0.34.2",
]

[project.scripts]
honda-databricks-mcp = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
